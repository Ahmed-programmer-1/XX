<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموقع تحت الصيانة</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px; gap: 14px;
    background: #0c0c0d; color: #f4f4f5;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
  }
  .icon { font-size: 3rem; }
  h1 { margin: 0; font-size: 1.3rem; font-weight: 900; }
  p { color: #a6a6ac; max-width: 420px; margin: 0; line-height: 1.7; }
  .bar { height: 3px; width: 60px; background: #e5202c; border-radius: 3px; margin: 4px 0; }
</style>
</head>
<body>
  <div class="icon">🛠️</div>
  <h1 id="siteNameHost">{{SITE_NAME}}</h1>
  <div class="bar"></div>
  <p id="msgHost">{{MESSAGE}}</p>
</body>
</html>
